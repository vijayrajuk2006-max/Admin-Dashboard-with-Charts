<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
}

body{
display:flex;
background:#f3f4f6;
min-height:100vh;
}

/* Sidebar */

.sidebar{
width:220px;
background:#111827;
color:white;
padding:20px;
}

.sidebar h2{
margin-bottom:30px;
color:#2563eb;
}

.sidebar a{
display:block;
color:#d1d5db;
text-decoration:none;
margin-bottom:15px;
font-size:14px;
}

.sidebar a:hover{
color:white;
}

/* Main */

.main{
flex:1;
padding:30px;
}

h1{
margin-bottom:25px;
}

/* Cards */

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:20px;
margin-bottom:30px;
}

.card{
background:white;
padding:20px;
border-radius:8px;
box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

.card h3{
font-size:14px;
color:#6b7280;
}

.card h2{
margin-top:10px;
}

/* Chart */

.chart-box{
background:white;
padding:20px;
border-radius:8px;
box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

.chart{
display:flex;
align-items:flex-end;
gap:20px;
height:200px;
margin-top:20px;
}

.bar{
flex:1;
background:#2563eb;
border-radius:5px 5px 0 0;
}

</style>
</head>

<body>

<div class="sidebar">

<h2>Admin Panel</h2>

<a href="#">Dashboard</a>
<a href="#">Users</a>
<a href="#">Orders</a>
<a href="#">Reports</a>
<a href="#">Settings</a>

</div>

<div class="main">

<h1>Dashboard Overview</h1>

<div class="cards">

<div class="card">
<h3>Total Users</h3>
<h2>1,245</h2>
</div>

<div class="card">
<h3>Orders</h3>
<h2>856</h2>
</div>

<div class="card">
<h3>Revenue</h3>
<h2>$12,540</h2>
</div>

<div class="card">
<h3>Visitors</h3>
<h2>3,421</h2>
</div>

</div>

<div class="chart-box">

<h3>Monthly Sales</h3>

<div class="chart">

<div class="bar" style="height:60%"></div>
<div class="bar" style="height:80%"></div>
<div class="bar" style="height:40%"></div>
<div class="bar" style="height:90%"></div>
<div class="bar" style="height:70%"></div>

</div>

</div>

</div>

</body>
</html>
